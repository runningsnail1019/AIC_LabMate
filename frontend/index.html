<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LabMate Demo</title>
  <style>
    :root { font-family: Inter, system-ui, sans-serif; color: #172033; background: #f4f7fb; }
    body { margin: 0; } .wrap { max-width: 1080px; margin: 0 auto; padding: 36px 20px; }
    h1 { margin-bottom: 6px; } .sub { color: #657089; margin-top: 0; }
    .grid { display: grid; grid-template-columns: 360px 1fr; gap: 20px; align-items: start; }
    .card { background: white; border: 1px solid #e2e8f0; border-radius: 16px; padding: 20px; box-shadow: 0 8px 28px #1d35570d; }
    label { display:block; font-size: 13px; font-weight: 700; margin: 16px 0 7px; } input, textarea { width: 100%; box-sizing: border-box; border: 1px solid #ccd5e2; border-radius: 9px; padding: 11px; font: inherit; }
    textarea { min-height: 88px; resize: vertical; } button { width:100%; margin-top:18px; background:#2563eb; border:0; color:white; border-radius:9px; padding:12px; font-weight:700; cursor:pointer; } button:disabled { opacity:.55; cursor:wait; }
    #preview { width:100%; max-height:300px; object-fit:contain; background:#f1f5f9; border-radius:10px; margin-top: 14px; display:none; }
    .pill { display:inline-block; padding:4px 9px; border-radius:999px; background:#eaf2ff; color:#2457b8; font-size:12px; } .result { white-space:pre-wrap; line-height:1.7; }
    pre { background:#0f172a; color:#dbeafe; padding:14px; border-radius:10px; overflow:auto; font-size:12px; } .muted { color:#718096; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body><main class="wrap">
  <h1>LabMate <span class="pill">MVP Demo</span></h1><p class="sub">上传仪器照片，输入问题，AI 会结合当前状态、设备说明书和已有对话规划下一步。</p>
  <div class="grid">
    <section class="card"><form id="form">
      <label for="version">知识库版本 / 型号</label><input id="version" value="EPI-EWB204+" required /><div class="muted" style="font-size:12px;margin-top:6px">仅用于选择对应知识库；图片默认就是本次要分析的设备现场。</div>
      <label for="question">你想完成什么？</label><textarea id="question" required>我想测量输入信号的频率</textarea>
      <label for="image">仪器照片</label><input id="image" type="file" accept="image/*" required /><img id="preview" alt="图片预览" />
      <button id="submit" type="submit">上传并分析</button>
    </form><p id="status" class="muted"></p></section>
    <section class="card"><h2>分析结果</h2><div id="empty" class="muted">提交一张图片后，结果会显示在这里。</div><div id="output" hidden>
      <h3>当前指导</h3><div id="guidance" class="result"></div><h3>任务规划</h3><div id="decision" class="result"></div><h3>需要你补充的信息</h3><div id="questions" class="result muted"></div><h3>视觉观察 JSON</h3><pre id="state"></pre><h3>知识库依据</h3><pre id="knowledge"></pre>
    </div></section>
  </div>
</main><script>
const form=document.querySelector('#form'), image=document.querySelector('#image'), preview=document.querySelector('#preview');
let history=[];
image.onchange=()=>{const f=image.files[0]; if(f){preview.src=URL.createObjectURL(f);preview.style.display='block';}};
form.onsubmit=async(e)=>{e.preventDefault(); const btn=document.querySelector('#submit'), status=document.querySelector('#status'); btn.disabled=true; status.textContent='正在上传图片并分析，请稍候…';
  const fd=new FormData(); fd.append('image',image.files[0]); fd.append('question',document.querySelector('#question').value); fd.append('version',document.querySelector('#version').value); fd.append('history',JSON.stringify(history));
  try { const r=await fetch('/api/analyze',{method:'POST',body:fd}); const data=await r.json(); if(!r.ok) throw new Error(data.detail||'请求失败');
    document.querySelector('#empty').hidden=true; document.querySelector('#output').hidden=false; document.querySelector('#guidance').textContent=data.guidance;
    const d=data.decision||{}; document.querySelector('#decision').textContent=`目标：${d.goal||'未识别'}\n状态：${d.status||'未知'}\n原因：${d.reason||'—'}\n预期变化：${d.expected_result||'—'}\n知识库依据是否充分：${d.evidence_sufficient===true?'是':'暂不足'}`;
    document.querySelector('#questions').textContent=(d.questions||[]).join('\n')||'本轮暂不需要补充信息。'; document.querySelector('#state').textContent=JSON.stringify(data.state,null,2); document.querySelector('#knowledge').textContent=data.knowledge_context;
    history.push({question:document.querySelector('#question').value, observation:data.state, decision:d}); status.textContent=`分析完成（${data.mode==='demo'?'演示模式':'Qwen 模式'}）`;
  } catch(err){status.textContent='分析失败：'+err.message;} finally{btn.disabled=false;}
};
</script></body></html>
